<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Shamie ❤️</title>
    <style>
        /* Styles de base et réinitialisation */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #ffe4e6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* En-tête */
        .header {
            text-align: center;
            margin-bottom: 30px;
            transition: opacity 0.5s ease;
        }

        .header h1 {
            color: #be123c;
            font-size: 2.2rem;
            font-family: 'Georgia', serif;
            margin-bottom: 8px;
        }

        .header p {
            color: #881337;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Enveloppe */
        .envelope-wrapper {
            perspective: 1000px;
            margin: 20px 0;
        }

        .envelope {
            position: relative;
            width: 320px;
            height: 220px;
            background-color: #f3e8de;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 20px 40px rgba(190, 18, 60, 0.15);
            cursor: pointer;
            transition: transform 0.4s ease;
            overflow: visible;
        }

        .envelope:hover {
            transform: translateY(-5px);
        }

        /* Rabats de l'enveloppe */
        .flap-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 130px solid #e2d2c1;
            transform-origin: top;
            transition: transform 0.5s ease 0.5s, z-index 0.1s 0.5s;
            z-index: 6;
        }

        .flap-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-top: 110px solid transparent;
            border-bottom: 110px solid transparent;
            border-left: 170px solid #ecdccb;
            border-bottom-left-radius: 12px;
            z-index: 5;
        }

        .flap-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-top: 110px solid transparent;
            border-bottom: 110px solid transparent;
            border-right: 170px solid #ecdccb;
            border-bottom-right-radius: 12px;
            z-index: 5;
        }

        .flap-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-bottom: 120px solid #dfcfbe;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 5;
        }

        /* Sceau en forme de cœur */
        .heart-seal {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #e11d48, #be123c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(190, 18, 60, 0.4);
            z-index: 7;
            transition: opacity 0.3s ease 0.6s, transform 0.3s ease 0.6s;
            color: white;
            font-size: 22px;
        }

        /* Aperçu de la lettre à l'intérieur */
        .letter-preview {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 290px;
            height: 190px;
            background: transparent;
            padding: 0;
            border: none;
            border-radius: 0;
            box-shadow: none;
            z-index: 2;
            overflow: hidden;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.1s, z-index 0.01s linear 0.1s;
        }

        .letter-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
        }

        /* Animations à l'ouverture (.open) */
        .envelope.open .flap-top {
            transform: rotateX(180deg);
            z-index: 1;
            transition: transform 0.5s ease, z-index 0.1s;
        }

        .envelope.open .heart-seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .envelope.open .letter-preview {
            transform: translate(-50%, -150px);
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.3s, z-index 0.01s linear 0.6s;
        }

        /* Modal Plein écran */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.4s ease;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            background: #fff1f2;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ffe4e6;
        }

        .modal-header h2 {
            color: #be123c;
            font-size: 1.1rem;
            font-family: 'Georgia', serif;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #9f1239;
            cursor: pointer;
            padding: 0 5px;
            line-height: 1;
        }

        /* MODIFICATIONS ICI : Suppression complète des marges autour de l'image */
        .modal-body {
            padding: 0;
            overflow-y: auto;
            background: transparent;
            display: flex;
            justify-content: center;
        }

        .modal-body img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 0;
            box-shadow: none;
        }

        .modal-footer {
            padding: 12px;
            background: white;
            text-align: center;
            border-top: 1px solid #f3f4f6;
        }

        .close-modal-btn {
            background: #e11d48;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
            transition: background 0.2s ease;
        }

        .close-modal-btn:hover {
            background: #be123c;
        }
    </style>
</head>
<body>

    <!-- En-tête principal -->
    <div class="header" id="header">
        <h1>Pour Shamie ❤️</h1>
        <p>Touche l'enveloppe pour l'ouvrir ✨</p>
    </div>

    <!-- Structure de l'enveloppe -->
    <div class="envelope-wrapper">
        <div class="envelope" id="envelope" onclick="openEnvelope()">
            <div class="flap-top"></div>
            <div class="flap-left"></div>
            <div class="flap-right"></div>
            <div class="flap-bottom"></div>
            
            <div class="heart-seal">❤️</div>

            <!-- Image de la lettre dans l'enveloppe -->
            <div class="letter-preview">
                <img src="image.png" alt="Aperçu de la lettre">
            </div>
        </div>
    </div>

    <!-- Fenêtre modale qui affiche la lettre entière -->
    <div class="modal" id="letterModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>De Willy, avec tout mon amour ❤️</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <div class="modal-body">
                <img src="image.png" alt="Lettre d'amour pour Shamie">
            </div>

            <div class="modal-footer">
                <button class="close-modal-btn" onclick="closeModal()">Fermer ❤️</button>
            </div>
        </div>
    </div>

    <script>
        let isOpen = false;

        function openEnvelope() {
            if (isOpen) return;
            isOpen = true;

            const envelope = document.getElementById('envelope');
            const header = document.getElementById('header');
            const modal = document.getElementById('letterModal');

            envelope.classList.add('open');
            header.style.opacity = '0';

            setTimeout(() => {
                modal.classList.add('active');
            }, 1300);
        }

        function closeModal() {
            const modal = document.getElementById('letterModal');
            const envelope = document.getElementById('envelope');
            const header = document.getElementById('header');

            modal.classList.remove('active');

            setTimeout(() => {
                envelope.classList.remove('open');
                header.style.opacity = '1';
                
                setTimeout(() => {
                    isOpen = false;
                }, 1000);
            }, 300);
        }
    </script>
</body>
</html>
